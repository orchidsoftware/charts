name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.12.0, 26.x]

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run the complete quality gate
        run: npm run check

      - name: Audit the published dependency graph
        run: npm audit --omit=dev --audit-level=high

      - name: Inspect the package archive
        run: npm run pack:check

      - name: Upload coverage report
        if: always() && matrix.node-version == '22.12.0'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-node-${{ matrix.node-version }}
          path: .vitest-attachments/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
