name: Publish Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the release
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module -e "import manifest from './package.json' with { type:'json' }; if (process.env.RELEASE_TAG !== 'v' + manifest.version) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run the complete quality gate
        run: npm run check

      - name: Check the registry
        id: registry
        run: |
          PACKAGE_SPEC=$(node -p "require('./package.json').name + '@' + require('./package.json').version")
          if npm view "$PACKAGE_SPEC" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack the already verified build
        if: steps.registry.outputs.exists != 'true'
        run: npm pack --ignore-scripts

      - name: Publish the verified package archive
        if: steps.registry.outputs.exists != 'true'
        run: npm publish ./*.tgz --ignore-scripts
