name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json without the v prefix
        required: true
        default: 0.0.4
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build v${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Verify the requested version
        run: node --input-type=module -e "import manifest from './package.json' with { type:'json' }; if (manifest.version !== process.env.RELEASE_VERSION) process.exit(1)"

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run the complete quality gate
        run: npm run check

      - name: Build the package archive
        run: npm pack --ignore-scripts

      - name: Upload the release candidate
        uses: actions/upload-artifact@v7
        with:
          name: orchid-charts-v${{ inputs.version }}
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 30
