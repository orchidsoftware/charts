name: Update Linux Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Generate Linux browser baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Generate Linux baselines
        run: |
          npx vitest run test/VisualRegression.test.js test/Lab.test.js test/RadarInspection.test.js --update
          CHARTS2_COMPATIBILITY=1 npx vitest run test/RadarInspection.test.js --update

      - name: Upload Linux baselines
        uses: actions/upload-artifact@v7
        with:
          name: chromium-linux-screenshots
          path: test/__screenshots__/**/*-linux.png
          if-no-files-found: error
          retention-days: 7
