<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160" viewBox="0 0 320 160" role="img" fill="none" style="background:var(--chart-bg)"><style>:root{--chart-bg:#ffffff;--chart-grid:#e5e7eb;--chart-text:#374151;--chart-axis:#9ca3af;--chart-font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"}@media (prefers-color-scheme: dark){:root{--chart-bg:#111827;--chart-grid:#374151;--chart-text:#f3f4f6;--chart-axis:#6b7280;--chart-font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"}}.chart-label{fill:var(--chart-text);font-family:var(--chart-font-family);font-size:12px;text-wrap:balance}.chart-legend-label{fill:var(--chart-text);font-family:var(--chart-font-family);font-size:11px}.chart-tooltip-title{fill:var(--chart-text);font-family:var(--chart-font-family);font-size:11px;font-weight:600;letter-spacing:.02em;text-wrap:balance}.chart-tooltip-value{fill:var(--chart-text);font-family:var(--chart-font-family);font-size:12px;font-weight:600;text-wrap:balance}.chart-tooltip-label{fill:var(--chart-text);font-family:var(--chart-font-family);font-size:10px;font-weight:600;letter-spacing:.02em;opacity:.58;text-wrap:balance}.chart-tooltip-meta{fill:var(--chart-text);font-family:var(--chart-font-family);font-size:10px;opacity:.58;text-wrap:balance}.chart-tooltip-marker{stroke-width:3;stroke-linecap:round}.chart-tooltip-panel{fill:var(--chart-bg);stroke:var(--chart-axis);stroke-width:1;filter:drop-shadow(0px 1px 4px rgba(17,43,66,.1)) drop-shadow(0px 2px 6px rgba(17,43,66,.08)) drop-shadow(0px 16px 24px rgba(17,43,66,.08))}.chart-tooltip-pointer{fill:var(--chart-bg);stroke:var(--chart-axis);stroke-width:.75}.chart-hover-guide{stroke:var(--chart-axis);stroke-width:1;stroke-dasharray:4,3}.chart-grid{stroke:var(--chart-grid);stroke-width:1}.chart-axis{stroke:var(--chart-axis);stroke-width:1}.chart-series{transition:opacity .15s ease}.chart-series:hover{opacity:.84}.chart-point:hover{stroke-width:3}.chart-slice:hover{opacity:.86}.chart-bar:hover{opacity:.8}.chart-hover-target{fill:transparent;cursor:crosshair;transition:fill .12s ease}.chart-hover-slot .chart-tooltip{opacity:0;pointer-events:none;transform:translateY(2px);transition:opacity .15s ease,transform .15s ease}.chart-hover-slot .chart-active-point{opacity:0;transition:opacity .12s ease}.chart-hover-slot .chart-active-bar{opacity:0;transition:opacity .12s ease}.chart-hover-slot .chart-hover-guide{opacity:0;transition:opacity .12s ease}.chart-hover-slot:hover .chart-tooltip{opacity:1;transform:translateY(0)}.chart-hover-slot:hover .chart-active-point{opacity:1}.chart-hover-slot:hover .chart-active-bar{opacity:.26}.chart-hover-slot:hover .chart-hover-guide{opacity:1}.chart-hover-slot:hover .chart-hover-target{fill:rgba(148,163,184,.14)}</style><g class="chart-grid-group"><line x1="56" y1="112" x2="296" y2="112" class="chart-grid" data-value="0"/><line x1="56" y1="90" x2="296" y2="90" class="chart-grid" data-value="0.75"/><line x1="56" y1="68" x2="296" y2="68" class="chart-grid" data-value="1.5"/><line x1="56" y1="46" x2="296" y2="46" class="chart-grid" data-value="2.25"/><line x1="56" y1="24" x2="296" y2="24" class="chart-grid" data-value="3"/><text x="48" y="116" class="chart-label" text-anchor="end">0</text><text x="48" y="94" class="chart-label" text-anchor="end">0.75</text><text x="48" y="72" class="chart-label" text-anchor="end">1.5</text><text x="48" y="50" class="chart-label" text-anchor="end">2.25</text><text x="48" y="28" class="chart-label" text-anchor="end">3</text><line x1="56" y1="24" x2="56" y2="112" class="chart-axis"/><line x1="56" y1="112" x2="296" y2="112" class="chart-axis"/></g><g data-label="Sales"><path d="M 96 82.67 C 136 82.67 136 24 176 24 C 216 24 216 53.33 256 53